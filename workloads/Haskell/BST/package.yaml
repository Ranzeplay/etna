name: etna-workload

dependencies:
    - base >= 4.7 && < 5
    - etna-lib
    - QuickCheck
    - smallcheck
    - leancheck
    - generic-random
    - silently

library:
    source-dirs: src

executables:
    etna-workload:
        main: Main.hs
        source-dirs: app
        ghc-options:
            - -threaded
            - -rtsopts
            - -with-rtsopts=-N
        dependencies:
            - etna-workload
        c-sources:
            - src/py_conn_ffi.c
        include-dirs:
            - src
        cc-options: -fPIC
        pkgconfig-depends:
            - python3-embed >= 3.10
